<script>

["8am","Surfing lessons",["Dreamland Beach","Balangan Beach"]],

["4pm","Beach",["Padang Padang Beach"]],

["8pm","Dinner?",["KALA Uluwatu"]]]),

["6pm","Item 5"],

["6:30pm","Will & Linda: Friends' Celebration · Slamet Riyadi St No.562, Surakarta",["AGRA Rooftop - Alila Hotel Solo"]]]),

["3:15pm","Fly Solo to Jakarta · Batik Air ID7367 · 3:15pm to 4:30pm · carry-on 7kg / checked 20kg"],
["8:45pm","Fly Jakarta to Sydney · QF42"],
["9pm","Backup: Jakarta to MEL to SYD · QF40 + book JQ flight MEL to SYD",[],1]]),
D("Day 10","Mon 12 Oct","Sydney","Sydney","syd",[
["7:30am","Back in Sydney (hopefully)"],
["12pm","Nap"],
["2pm","Bum day"]])];
const KEY="bali-itin-v1";let S,editing=false;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(S))S=JSON.parse(JSON.stringify(DEF));
let url="";try{url=localStorage.getItem("bali-sheet-url")||""}catch(e){}
const setStat=t=>{document.getElementById("stat").textContent=t};
let at=0,tm=null,busy=false,view="it",openN=null,B=[];try{B=JSON.parse(localStorage.getItem("bali-budget"))}catch(e){}if(!Array.isArray(B))B=[];try{at=+localStorage.getItem("bali-at")||0}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem("bali-at",at);localStorage.setItem("bali-budget",JSON.stringify(B))}catch(e){}}
function save(){at=Date.now();persist();clearTimeout(tm);if(url){setStat("Saving…");tm=setTimeout(()=>{tm=null;push()},1500)}}
const typing=()=>document.activeElement&&document.activeElement.tagName=="INPUT";
async function push(){try{const r=await fetch(url,{method:"POST",body:JSON.stringify({at,days:S,budget:B})});const j=await r.json();setStat(j.ok?"Synced ✓ "+new Date().toLocaleTimeString():"Save error")}catch(e){setStat("Offline – will retry")}}
async function pull(f){if(!url){if(f===true)setUrl();else setStat("No sheet link set");return}
if(f!==true&&(busy||tm||typing()))return;busy=true;setStat("Checking…");
try{const r=await fetch(url);const j=await r.json();
if(!j.days){await push()}
else if(j.at>at){S=j.days;if(Array.isArray(j.budget))B=j.budget;at=j.at;persist();render();setStat("Synced ✓ "+new Date().toLocaleTimeString())}
else if(j.at<at){await push()}
else setStat("Synced ✓ "+new Date().toLocaleTimeString())}catch(e){setStat(navigator.onLine===false?"Offline – showing saved copy":"Sync failed: "+(e&&e.message||e))}busy=false}
function setUrl(){const c=document.getElementById("u");c.value=url;c.focus()}
function saveUrl(){url=document.getElementById("u").value.trim();let ok=true;try{localStorage.setItem("bali-sheet-url",url);ok=localStorage.getItem("bali-sheet-url")===url}catch(e){ok=false}
if(!url){setStat("No sheet link set");return}
if(!ok)alert("This browser can't remember the link, so you'll need to re-enter it each visit (try Safari/Chrome instead of an in-app browser).");pull(true)}
async function checkVer(){try{const r=await fetch(location.pathname+"?t="+Date.now(),{cache:"no-store"});const m=(await r.text()).match(/APP_VERSION="([^"]+)"/);
if(m&&m[1]!==APP_VERSION){const n=+sessionStorage.getItem("bali-rl")||0;if(n<2){sessionStorage.setItem("bali-rl",n+1);location.replace(location.pathname+"?v="+encodeURIComponent(m[1]))}}else sessionStorage.removeItem("bali-rl")}catch(e){}}
setInterval(pull,15000);setInterval(checkVer,60000);checkVer();document.addEventListener("visibilitychange",()=>{if(!document.hidden){pull();checkVer()}});if(url)pull();else setStat("No sheet link – tap 🔗");

const link=(p,a)=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p+" "+a);

const ti=todayIdx();
document.getElementById("app").innerHTML=S.map((d,i)=>`<section class="day" id="day-${i}">
<div class="dh" style="background:var(--${d.color||"syd"})">${editing?`<div class="dhe">
<input type="text" value="${esc(d.d)}" placeholder="Day" oninput="S[${i}].d=this.value;save()">
<input type="text" value="${esc(d.date)}" placeholder="Date" oninput="S[${i}].date=this.value;save()">

<input type="text" value="${esc(d.area)}" placeholder="Map area (e.g. Ubud, Bali)" oninput="S[${i}].area=this.value;save()"></div>
<button onclick="delDay(${i})">🗑 Day</button>`:`<div><b>${esc(d.d)} · ${esc(d.date)}</b>${i==ti?'<span class="tb">Today</span>':""}<small>${esc(d.loc)}</small></div>`}</div>
${d.items.map((it,j)=>editing?`<div class="item ${it.b?"bk":""}"><div class="t"><input type="text" value="${esc(it.t)}" oninput="S[${i}].items[${j}].t=this.value;save()"></div>

<div class="ed"><label><input type="checkbox" ${it.b?"checked":""} onchange="S[${i}].items[${j}].b=this.checked?1:0;save();render()"> Backup plan</label><button onclick="delItem(${i},${j})">Remove</button></div></div></div>`
:`<div class="item ${it.b?"bk":""}"><div class="t">${esc(it.t)}</div><div class="x">${esc(it.x)}${it.p.length?"<div>"+it.p.map(p=>`<a class="pl" target="_blank" rel="noopener" href="${link(p,d.area)}">📍 ${esc(p)}</a>`).join("")+"</div>":""}${noteHtml(i,j,it)}</div><button class="nib${it.n?" has":""}" onclick="openNote(${i},${j})" aria-label="Note" title="Note"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M7 12q1.5-3 3 0t3 0t3 0"/></svg></button></div>`).join("")}

const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function dayDate(d){const m=/(\d{1,2})\s+([A-Za-z]{3})/.exec(d.date||"");if(!m||MON[m[2].toLowerCase()]==null)return null;return new Date(new Date().getFullYear(),MON[m[2].toLowerCase()],+m[1])}
function today0(){const n=new Date();n.setHours(0,0,0,0);return n}
function todayIdx(){const n=today0().getTime();return S.findIndex(d=>{const x=dayDate(d);return x&&x.getTime()==n})}
function goDay(i){const e=document.getElementById("day-"+i);if(e)e.scrollIntoView({behavior:"smooth",block:"start"})}
function goToday(){let i=todayIdx();if(i<0){const n=today0();i=S.findIndex(d=>{const x=dayDate(d);return x&&x>n});if(i<0)i=0}goDay(i)}
function renderChips(ti){const t=today0();document.getElementById("chips").innerHTML=S.map((d,i)=>{const x=dayDate(d);const c=i==ti?" now":(x&&x<t?" past":"");return `<button class="chip${c}" onclick="goDay(${i})">D${i+1}</button>`}).join("")}
let rate=10500,rateAt=0,fxOff=false;try{const r=JSON.parse(localStorage.getItem("bali-fx"));if(r&&r.rate>0){rate=r.rate;rateAt=r.at}}catch(e){}
const fmt=n=>isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:2}):"";
const num=v=>parseFloat(String(v).replace(/,/g,""))||0;
function fxShow(){document.getElementById("rate").value=rate;
document.getElementById("fxs").textContent=(rateAt?"Rate updated "+new Date(rateAt).toLocaleDateString():"Estimated rate – tap ↻ when online")+(fxOff?" · offline, using saved rate":"");
document.getElementById("fxq").textContent=[50000,100000,500000,1000000].map(v=>fmt(v)+" IDR ≈ "+fmt(v/rate)+" AUD").join(" · ")}
function fxSave(){try{localStorage.setItem("bali-fx",JSON.stringify({rate,at:rateAt}))}catch(e){}}
function fxFrom(w){const a=document.getElementById("aud"),r=document.getElementById("idr");
if(w=="rate"){const v=num(document.getElementById("rate").value);if(v>0){rate=v;rateAt=0;fxSave()}w="aud"}
if(w=="aud")r.value=a.value?fmt(num(a.value)*rate):"";else a.value=r.value?fmt(num(r.value)/rate):"";fxShow()}
async function fxRefresh(){fxOff=false;document.getElementById("fxs").textContent="Refreshing…";
try{const r=await fetch("https://open.er-api.com/v6/latest/AUD");const j=await r.json();const v=j&&j.rates&&j.rates.IDR;if(v>0){rate=v;rateAt=Date.now();fxSave()}else fxOff=true}catch(e){fxOff=true}
fxShow();fxFrom("aud")}
function fxToggle(){const p=document.getElementById("fx");p.style.display=p.style.display=="none"?"block":"none";fxShow();if(p.style.display=="block"&&(!rateAt||Date.now()-rateAt>864e5))fxRefresh()}
addEventListener("online",()=>pull());addEventListener("offline",()=>setStat("Offline – showing saved copy"));
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
function noteHtml(i,j,it){if(openN&&openN[0]==i&&openN[1]==j)return `<input type="text" id="ni" class="ni" value="${esc(it.n||"")}" placeholder="Add a note…" onblur="saveNote(${i},${j},this.value)" onkeydown="if(event.key=='Enter')this.blur()">`;
return it.n?`<div class="nt" onclick="openNote(${i},${j})">${esc(it.n)}</div>`:""}
function openNote(i,j){openN=[i,j];render();setTimeout(()=>{const e=document.getElementById("ni");if(e)e.focus()},0)}
function saveNote(i,j,v){if(!openN)return;openN=null;S[i].items[j].n=v.trim();save();render()}
function tmin(t){const m=/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i.exec(String(t).trim());if(!m)return null;let h=+m[1];const p=(m[3]||"").toLowerCase();if(p=="pm"&&h<12)h+=12;if(p=="am"&&h==12)h=0;return h*60+(+m[2]||0)}
function openM(){const sel=document.getElementById("m-d");sel.innerHTML=S.map((d,i)=>`<option value="${i}">${esc(d.d)} · ${esc(d.date)}</option>`).join("");const ti=todayIdx();sel.value=ti>=0?ti:0;document.getElementById("m-t").value="";document.getElementById("m-x").value="";document.getElementById("modal").style.display="flex";setTimeout(()=>document.getElementById("m-t").focus(),0)}
function closeM(){document.getElementById("modal").style.display="none"}
function addEntry(){const i=+document.getElementById("m-d").value,t=document.getElementById("m-t").value.trim(),x=document.getElementById("m-x").value.trim();if(!x||!S[i])return;
const it={t,x,p:[],b:0,n:""},n=tmin(t),a=S[i].items;let k=n==null?-1:a.findIndex(o=>{const q=tmin(o.t);return q!=null&&q>n});if(k<0)a.push(it);else a.splice(k,0,it);
save();closeM();if(view!="it")tab("it");render();setTimeout(()=>goDay(i),50)}
function tab(v){view=v;const b=v=="bd";document.getElementById("itin").style.display=b?"none":"block";document.getElementById("bd").style.display=b?"block":"none";
document.getElementById("hi").style.display=b?"none":"";document.getElementById("fab-add").style.display=b?"none":"flex";
document.getElementById("set").style.display=!b&&editing?"block":"none";
document.getElementById("t-it").classList.toggle("on",!b);document.getElementById("t-bd").classList.toggle("on",b);if(b)renderBudget()}
const CATS=[["Food & drink","#e9a23b"],["Transport","#3b82c4"],["Accommodation","#8e5bd0"],["Activities","#2e9e5b"],["Shopping","#d64f8a"],["Other","#8a8f98"]];
const f0=n=>Math.round(n).toLocaleString("en-US"),short=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"k":String(Math.round(n)),sumA=a=>a.reduce((t,e)=>t+e.a,0);
let bcur="IDR";try{bcur=localStorage.getItem("bali-bcur")==="AUD"?"AUD":"IDR"}catch(e){}
const cv=n=>bcur=="AUD"?n/rate:n,fc=n=>bcur=="AUD"?cv(n).toLocaleString("en-US",{maximumFractionDigits:2}):f0(n);
const money=n=>bcur=="AUD"?"A$"+fc(n)+" (≈Rp "+f0(n)+")":"Rp "+f0(n)+" (≈A$"+f0(n/rate)+")";
function setCur(c){bcur=c;try{localStorage.setItem("bali-bcur",c)}catch(e){}renderBudget()}
function renderBudget(){const ds=document.getElementById("b-d"),fs=document.getElementById("b-f"),cs=document.getElementById("b-c"),dv=ds.value,fv=fs.value;
const opts=S.map(d=>`<option value="${esc(d.date||d.d)}">${esc(d.d)} · ${esc(d.date)}</option>`).join("");
ds.innerHTML=opts;fs.innerHTML='<option value="">Whole trip</option>'+opts;const ti=todayIdx();
ds.value=dv||(ti>=0?S[ti].date:(S[0]?S[0].date:""));fs.value=fv;if(!cs.options||!cs.options.length)cs.innerHTML=CATS.map(c=>`<option>${c[0]}</option>`).join("");
document.getElementById("bc-IDR").classList.toggle("on",bcur=="IDR");document.getElementById("bc-AUD").classList.toggle("on",bcur=="AUD");
const f=fs.value,L=B.filter(e=>!f||e.d==f),tot=sumA(L),ct=CATS.map(c=>[c[0],c[1],sumA(L.filter(e=>e.c==c[0]))]);let acc=0;
const stops=tot?ct.filter(c=>c[2]>0).map(c=>{const a=acc;acc+=c[2]/tot*100;return `${c[1]} ${a}% ${acc}%`}).join(","):"var(--ln) 0% 100%";
document.getElementById("b-sum").innerHTML=`<div class="sub" style="margin-bottom:6px">${f?esc(f):"Whole trip"} · ${money(tot)}</div><div style="display:flex;gap:14px;align-items:center"><div class="donut" style="background:conic-gradient(${stops})"><div>${tot?short(cv(tot)):"–"}</div></div><div style="flex:1;min-width:0">${ct.map(c=>`<div class="lg"><span class="dot" style="background:${c[1]}"></span>${esc(c[0])}<b>${fc(c[2])}${tot?" · "+Math.round(c[2]/tot*100)+"%":""}</b></div>`).join("")}</div></div>`;
const dt=S.map(d=>({k:d.date||d.d,e:B.filter(e=>e.d==(d.date||d.d))})),mx=Math.max(1,...dt.map(x=>sumA(x.e)));
document.getElementById("b-days").innerHTML=`<div class="sub">Spend per day (${bcur}) – tap a bar to filter</div><div class="bars">`+dt.map((x,i)=>{const t=sumA(x.e);return `<div class="bc${x.k==f?" sel":""}" data-k="${esc(x.k)}" onclick="pickDay(this.dataset.k)"><small>${t?short(cv(t)):""}</small><div class="st">${CATS.map(c=>{const v=sumA(x.e.filter(e=>e.c==c[0]));return v?`<i style="height:${Math.max(2,v/mx*110)}px;background:${c[1]}"></i>`:""}).join("")}</div><small>D${i+1}</small></div>`}).join("")+"</div>";
const order=k=>{const i=S.findIndex(d=>(d.date||d.d)==k);return i<0?999:i},lbl=k=>{const d=S.find(d=>(d.date||d.d)==k);return d?d.d:k};
const XI='<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>';
document.getElementById("b-list").innerHTML=L.length?[...L].sort((a,b)=>order(a.d)-order(b.d)).map(e=>`<div class="er"><span class="dot" style="background:${(CATS.find(c=>c[0]==e.c)||CATS[5])[1]}"></span><div class="ex"><div>${esc(e.x)}</div><small>${esc(lbl(e.d))} · ${esc(e.c)}</small></div><b>${fc(e.a)}</b><button class="ib" data-id="${esc(e.id)}" onclick="delExp(this.dataset.id)" aria-label="Delete">${XI}</button></div>`).join(""):'<div class="sub">No expenses yet – add one above.</div>'}
function pickDay(k){const fs=document.getElementById("b-f");fs.value=fs.value==k?"":k;renderBudget()}
function addExp(){const a=num(document.getElementById("b-a").value);if(!(a>0))return;const c=document.getElementById("b-c").value,x=document.getElementById("b-x").value.trim();
B.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d:document.getElementById("b-d").value,x:x||c,c,a:Math.round(document.getElementById("b-u").value=="AUD"?a*rate:a)});
document.getElementById("b-a").value="";document.getElementById("b-x").value="";save();renderBudget()}
function delExp(id){B=B.filter(e=>e.id!=id);save();renderBudget()}
render();
if(todayIdx()>=0)setTimeout(goToday,300);
</script></body></html>
