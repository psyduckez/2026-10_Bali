<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Bali Itinerary</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f2;--card:#fff;--tx:#222;--mu:#777;--ln:#e6e0d6;--ac:#0b6e6e;--bk:#fde8cc;--ubud:#f3dde6;--ulu:#dbe6f7;--solo:#dcebd5;--jkt:#f2d4d0;--syd:#eee}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17181a;--card:#222426;--tx:#eee;--mu:#9a9a9a;--ln:#3a3c3f;--ac:#5fc4c4;--bk:#4a3820;--ubud:#4a2f3b;--ulu:#2b3a52;--solo:#2f4430;--jkt:#4d2e2a;--syd:#333}}
:root[data-theme=dark]{--bg:#17181a;--card:#222426;--tx:#eee;--mu:#9a9a9a;--ln:#3a3c3f;--ac:#5fc4c4;--bk:#4a3820;--ubud:#4a2f3b;--ulu:#2b3a52;--solo:#2f4430;--jkt:#4d2e2a;--syd:#333}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:16px;max-width:720px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:24px}.sub{color:var(--mu);font-size:13px}
button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer}
button.pri{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.day{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin-bottom:14px;overflow:hidden}
.dh{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--syd)}
.dh b{font-size:16px}.dh small{color:var(--mu);display:block}
.item{display:flex;gap:10px;padding:8px 12px;border-top:1px solid var(--ln)}
.item.bk{background:var(--bk)}
.t{width:64px;flex:none;color:var(--mu);font-size:13px;padding-top:1px}
.x{flex:1;min-width:0}
.pl{display:inline-block;margin:3px 6px 0 0;padding:1px 8px;border-radius:12px;border:1px solid var(--ac);color:var(--ac);text-decoration:none;font-size:13px}
input[type=text]{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:5px 7px;margin-bottom:4px}
.ed{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mu)}
.add{padding:8px 12px;border-top:1px solid var(--ln)}
.dhe{flex:1}
.ver{text-align:center;color:var(--mu);font-size:11px;opacity:.6;margin:18px 0 6px}
</style></head><body>
<header><div><h1>Bali Itinerary</h1><div class="sub">Oct 3 – Oct 12 · tap places for Google Maps · <span id="stat">Not synced</span></div></div>
<div><button id="edit" class="pri">Edit</button> <button onclick="pull(true)">🔄 Sync</button> <button onclick="setUrl()">🔗 Sheet link</button> <button id="reset">Reset</button></div></header>
<div id="app"></div><div id="addday" style="display:none"><button class="pri" onclick="addDay()">+ Add day</button></div>
<div class="ver" id="ver"></div>
<script>
const APP_VERSION="1.0.1";
document.getElementById("ver").textContent="v"+APP_VERSION;
const D=(d,date,loc,area,color,items)=>({d,date,loc,area,color,items:items.map(i=>({t:i[0],x:i[1],p:i[2]||[],b:i[3]||0}))});
const DEF=[
D("Day 1","Sat 3 Oct","Ubud","Ubud, Bali","ubud",[
["6:15am","Jetstar Sydney to Denpasar JQ39 · arrive 10:15am local time"],
["11am","Travel to hotel"],
["2pm","Check-in: Emana Akatara, Pejeng Kawan, Tampaksiring, Ubud 80552",["Emana Akatara"]],
["4pm","Checkout town + Karsa Spa",["Karsa Spa"]],
["6pm","Karsa Spa + Dinner",["Karsa Spa"]],
["4:20pm","Backup plan: Qantas Sydney to Denpasar, 4:20pm to 8:50pm",[],1]]),
D("Day 2","Sun 4 Oct","Ubud","Ubud, Bali","ubud",[
["6am","Breakfast"],
["8am","Tegalalang Rice Terrace (cycling?)",["Tegalalang Rice Terrace","Coffee Plantation Bali Pulina"]],
["12pm","Lunch",["Tis Cafe","Cretya Ubud"]],
["4pm","Spa + Campuhan Ridge Walk",["Kamandalu Spa","Campuhan Ridge Walk"]],
["6pm","Dinner (sunset)",["The Sayan House"]],
["8pm","Dessert (might need to book)",["Room4Dessert"]]]),
D("Day 3","Mon 5 Oct","Ubud","Ubud, Bali","ubud",[
["6am","Mount Batur? Breakfast"],
["8am","Elephant Cave",["Goa Gajah"]],
["12pm","Waterfall",["Suwat Waterfall"]],
["4pm","Waterfall + warung lunch",["Tibumana Waterfall","Warung Babi Guling Pande Egi"]],
["6pm","Waterfall",["Kanto Lampo Waterfall"]],
["8pm","Dinner: Skewers / Indonesian cuisine / Fancy",["Naughty Nuri's Ubud","Warung Pulau Kelapa","NUSA Ubud"]]]),
D("Day 4","Tue 6 Oct","Ubud → Uluwatu","Uluwatu, Bali","ulu",[
["6am","Breakfast"],
["8am","Art market & pottery",["Ubud Art Market","Serayu Pottery"]],
["12pm","Lunch",["Milk & Madu"]],
["3pm","Travel to hotel and check in",["Uluwatu Dream Inn"]],
["6pm","Fire dance",["Kecak Fire Dance Uluwatu"]],
["8pm","Dinner – ?"]]),
D("Day 5","Wed 7 Oct","Uluwatu","Uluwatu, Bali","ulu",[
["6am","Breakfast",["Analog Uluwatu"]],
["8am","Beach",["Thomas Beach"]],
["12pm","Lunch",["Gooseberry French Restaurant"]],
["4pm","Beach",["Suluban Beach"]],
["6pm","Relax at pool / cliff house",["Ulu Cliff House","Single Fin"]],
["8pm","Dinner",["YUKI Uluwatu"]]]),
D("Day 6","Thu 8 Oct","Uluwatu","Uluwatu, Bali","ulu",[
["6am","Breakfast in town",["Artisan Uluwatu"]],
["8am","Surfing lessons",["Dreamland Beach","Balangan Beach"]],
["12pm","Lunch",["Alchemy Uluwatu"]],
["4pm","Beach",["Padang Padang Beach"]],
["6pm","Sunset drinks",["Savaya","Sundays Beach Club"]],
["8pm","Dinner?",["KALA Uluwatu"]]]),
D("Day 7","Fri 9 Oct","Uluwatu → Solo","Uluwatu, Bali","solo",[
["6am","Breakfast in town",["Baked Uluwatu"]],
["8am","Explore town"],
["12pm","Spa"],
["4pm","Fly to Solo"],
["6pm","Item 5"],
["8pm","Item 6"]]),
D("Day 8","Sat 10 Oct","Solo","Solo, Indonesia","solo",[
["10am","Will & Linda: Holy Matrimony",["Gereja Santo Antonius Padua Purbayan"]],
["12:30pm","Will & Linda: Afternoon Reception · Jl. Ahmad Yani no 45, Gilingan, Banjarsari, Surakarta",["Swiss-Belhotel Gilingan, Solo"]],
["3pm","Break · Linda's Bakery",["Buttersome Bakehouse"]],
["6:30pm","Will & Linda: Friends' Celebration · Slamet Riyadi St No.562, Surakarta",["AGRA Rooftop - Alila Hotel Solo"]]]),
D("Day 9","Sun 11 Oct","Solo → Jakarta","Indonesia","jkt",[
["3:15pm","Fly Solo to Jakarta · Batik Air ID7367 · 3:15pm to 4:30pm · carry-on 7kg / checked 20kg"],
["8:45pm","Fly Jakarta to Sydney · QF42"],
["9pm","Backup: Jakarta to MEL to SYD · QF40 + book JQ flight MEL to SYD",[],1]]),
D("Day 10","Mon 12 Oct","Sydney","Sydney","syd",[
["7:30am","Back in Sydney (hopefully)"],
["12pm","Nap"],
["2pm","Bum day"]])];
const KEY="bali-itin-v1";let S,editing=false;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(S))S=JSON.parse(JSON.stringify(DEF));
let url="";try{url=localStorage.getItem("bali-sheet-url")||""}catch(e){}
let at=0,tm=null,busy=false;try{at=+localStorage.getItem("bali-at")||0}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem("bali-at",at)}catch(e){}}
function save(){at=Date.now();persist();clearTimeout(tm);if(url){setStat("Saving…");tm=setTimeout(()=>{tm=null;push()},1500)}}
const typing=()=>document.activeElement&&document.activeElement.tagName=="INPUT";
async function push(){try{const r=await fetch(url,{method:"POST",body:JSON.stringify({at,days:S})});const j=await r.json();setStat(j.ok?"Synced ✓ "+new Date().toLocaleTimeString():"Save error")}catch(e){setStat("Offline – will retry")}}
async function pull(f){if(!url){if(f===true)setUrl();else setStat("No sheet link set");return}
if(f!==true&&(busy||tm||typing()))return;busy=true;setStat("Checking…");
try{const r=await fetch(url);const j=await r.json();
if(!j.days){await push()}
else if(j.at>at){S=j.days;at=j.at;persist();render();setStat("Synced ✓ "+new Date().toLocaleTimeString())}
else if(j.at<at){await push()}
else setStat("Synced ✓ "+new Date().toLocaleTimeString())}catch(e){setStat("Sync failed: "+(e&&e.message||e))}busy=false}
function setUrl(){const u=prompt("Paste your Google Apps Script web app URL:",url);if(u!==null){url=u.trim();try{localStorage.setItem("bali-sheet-url",url)}catch(e){}if(url)pull(true)}return url}
async function checkVer(){try{const r=await fetch(location.pathname+"?t="+Date.now(),{cache:"no-store"});const m=(await r.text()).match(/APP_VERSION="([^"]+)"/);
if(m&&m[1]!==APP_VERSION){const n=+sessionStorage.getItem("bali-rl")||0;if(n<2){sessionStorage.setItem("bali-rl",n+1);location.replace(location.pathname+"?v="+encodeURIComponent(m[1]))}}else sessionStorage.removeItem("bali-rl")}catch(e){}}
setInterval(pull,15000);setInterval(checkVer,60000);checkVer();document.addEventListener("visibilitychange",()=>{if(!document.hidden){pull();checkVer()}});if(url)pull();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const link=(p,a)=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p+" "+a);
function render(){
document.getElementById("app").innerHTML=S.map((d,i)=>`<section class="day">
<div class="dh" style="background:var(--${d.color||"syd"})">${editing?`<div class="dhe">
<input type="text" value="${esc(d.d)}" placeholder="Day" oninput="S[${i}].d=this.value;save()">
<input type="text" value="${esc(d.date)}" placeholder="Date" oninput="S[${i}].date=this.value;save()">
<input type="text" value="${esc(d.loc)}" placeholder="Location" oninput="S[${i}].loc=this.value;save()">
<input type="text" value="${esc(d.area)}" placeholder="Map area (e.g. Ubud, Bali)" oninput="S[${i}].area=this.value;save()"></div>
<button onclick="delDay(${i})">🗑 Day</button>`:`<div><b>${esc(d.d)} · ${esc(d.date)}</b><small>${esc(d.loc)}</small></div>`}</div>
${d.items.map((it,j)=>editing?`<div class="item ${it.b?"bk":""}"><div class="t"><input type="text" value="${esc(it.t)}" oninput="S[${i}].items[${j}].t=this.value;save()"></div>
<div class="x"><input type="text" value="${esc(it.x)}" oninput="S[${i}].items[${j}].x=this.value;save()">
<input type="text" value="${esc(it.p.join(", "))}" placeholder="Places (comma separated) → map links" oninput="S[${i}].items[${j}].p=this.value.split(',').map(s=>s.trim()).filter(Boolean);save()">
<div class="ed"><label><input type="checkbox" ${it.b?"checked":""} onchange="S[${i}].items[${j}].b=this.checked?1:0;save();render()"> Backup plan</label><button onclick="delItem(${i},${j})">Remove</button></div></div></div>`
:`<div class="item ${it.b?"bk":""}"><div class="t">${esc(it.t)}</div><div class="x">${esc(it.x)}${it.p.length?"<div>"+it.p.map(p=>`<a class="pl" target="_blank" rel="noopener" href="${link(p,d.area)}">📍 ${esc(p)}</a>`).join("")+"</div>":""}</div></div>`).join("")}
${editing?`<div class="add"><button onclick="addItem(${i})">+ Add item</button></div>`:""}</section>`).join("");
}
function addItem(i){S[i].items.push({t:"",x:"",p:[],b:0});save();render()}
function delItem(i,j){S[i].items.splice(j,1);save();render()}
function addDay(){S.push({d:"Day "+(S.length+1),date:"",loc:"",area:"Bali",color:"syd",items:[]});save();render()}
function delDay(i){if(confirm("Remove this day?")){S.splice(i,1);save();render()}}
document.getElementById("edit").onclick=function(){editing=!editing;this.textContent=editing?"Done":"Edit";document.getElementById("addday").style.display=editing?"block":"none";render()};
document.getElementById("reset").onclick=()=>{if(confirm("Reset to the original itinerary? Your edits will be lost.")){S=JSON.parse(JSON.stringify(DEF));save();render()}};
render();
</script></body></html>
